<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Webwise Digital tribal knowledge hero visual</title>
  <desc id="desc">A single expert holding scattered business knowledge while Webwise converts it into a shared operating system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.62" stop-color="#101820"/>
      <stop offset="1" stop-color="#071312"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29ABE2"/>
      <stop offset="1" stop-color="#00D4AA"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#29ABE2" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/>
  <rect width="1400" height="800" fill="url(#grid)"/>
  <circle cx="1038" cy="170" r="210" fill="#29ABE2" opacity=".08"/>
  <circle cx="286" cy="640" r="190" fill="#00D4AA" opacity=".06"/>
  <g transform="translate(138 126)">
    <text x="0" y="0" fill="#29ABE2" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">WEBWISE DIGITAL</text>
    <text x="0" y="82" fill="#F2F2EE" font-family="Arial, sans-serif" font-size="76" font-weight="900">The Tribal</text>
    <text x="0" y="164" fill="#F2F2EE" font-family="Arial, sans-serif" font-size="76" font-weight="900">Knowledge Trap</text>
    <text x="0" y="232" fill="#8B949E" font-family="Arial, sans-serif" font-size="26">Turn one person's know-how into a</text>
    <text x="0" y="270" fill="#8B949E" font-family="Arial, sans-serif" font-size="26">company-wide operating system.</text>
  </g>
  <g transform="translate(770 156)">
    <rect x="0" y="0" width="470" height="510" rx="24" fill="#111111" stroke="#29ABE2" stroke-opacity=".24"/>
    <circle cx="236" cy="112" r="66" fill="#F2F2EE"/>
    <path d="M154 238c16-56 148-56 164 0l36 128H118l36-128Z" fill="url(#blue)" filter="url(#glow)"/>
    <g fill="none" stroke="#29ABE2" stroke-width="3" stroke-linecap="round" opacity=".9">
      <path d="M82 88c-44 28-58 84-34 134"/>
      <path d="M384 88c48 34 56 92 26 142"/>
      <path d="M108 404c72 58 174 72 256 12"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
      <rect x="32" y="264" width="142" height="62" rx="12" fill="#080808" stroke="#29ABE2" stroke-opacity=".34"/>
      <text x="62" y="303" fill="#F2F2EE">Sales Flow</text>
      <rect x="292" y="250" width="144" height="62" rx="12" fill="#080808" stroke="#29ABE2" stroke-opacity=".34"/>
      <text x="320" y="289" fill="#F2F2EE">Follow-up</text>
      <rect x="165" y="408" width="158" height="62" rx="12" fill="#080808" stroke="#00D4AA" stroke-opacity=".42"/>
      <text x="203" y="447" fill="#F2F2EE">Playbook</text>
    </g>
    <circle cx="236" cy="112" r="16" fill="#29ABE2"/>
  </g>
</svg>
