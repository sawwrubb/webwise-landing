<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge Vault workflow visual</title>
  <desc id="desc">A six-step workflow from task recording to owner review and automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#29ABE2" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1400" height="760" fill="url(#bg)"/>
  <rect width="1400" height="760" fill="url(#grid)"/>
  <text x="80" y="94" fill="#29ABE2" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">KNOWLEDGE VAULT FRAMEWORK</text>
  <text x="80" y="158" fill="#F2F2EE" font-family="Arial, sans-serif" font-size="58" font-weight="900">Record. Process. Distribute.</text>
  <text x="80" y="202" fill="#8B949E" font-family="Arial, sans-serif" font-size="24">Do not automate chaos. Capture the work first, then build the system.</text>
  <g transform="translate(84 302)" font-family="Arial, sans-serif">
    <path d="M134 98H1110" stroke="#29ABE2" stroke-width="3" stroke-dasharray="10 12" opacity=".6"/>
    <g>
      <rect x="0" y="0" width="210" height="196" rx="14" fill="#111111" stroke="#29ABE2" stroke-opacity=".28"/>
      <circle cx="105" cy="58" r="30" fill="#29ABE2"/>
      <text x="105" y="67" text-anchor="middle" fill="#080808" font-size="28" font-weight="900">1</text>
      <text x="105" y="118" text-anchor="middle" fill="#F2F2EE" font-size="24" font-weight="900">Task</text>
      <text x="105" y="150" text-anchor="middle" fill="#8B949E" font-size="16">Pick one repeat job</text>
    </g>
    <g transform="translate(204)">
      <rect x="0" y="0" width="210" height="196" rx="14" fill="#111111" stroke="#29ABE2" stroke-opacity=".28"/>
      <circle cx="105" cy="58" r="30" fill="#29ABE2"/>
      <text x="105" y="67" text-anchor="middle" fill="#080808" font-size="28" font-weight="900">2</text>
      <text x="105" y="118" text-anchor="middle" fill="#F2F2EE" font-size="24" font-weight="900">Loom</text>
      <text x="105" y="150" text-anchor="middle" fill="#8B949E" font-size="16">Record the expert</text>
    </g>
    <g transform="translate(408)">
      <rect x="0" y="0" width="210" height="196" rx="14" fill="#111111" stroke="#29ABE2" stroke-opacity=".28"/>
      <circle cx="105" cy="58" r="30" fill="#29ABE2"/>
      <text x="105" y="67" text-anchor="middle" fill="#080808" font-size="28" font-weight="900">3</text>
      <text x="105" y="118" text-anchor="middle" fill="#F2F2EE" font-size="24" font-weight="900">Playbook</text>
      <text x="105" y="150" text-anchor="middle" fill="#8B949E" font-size="16">Make it searchable</text>
    </g>
    <g transform="translate(612)">
      <rect x="0" y="0" width="210" height="196" rx="14" fill="#111111" stroke="#00D4AA" stroke-opacity=".34"/>
      <circle cx="105" cy="58" r="30" fill="#00D4AA"/>
      <text x="105" y="67" text-anchor="middle" fill="#080808" font-size="28" font-weight="900">4</text>
      <text x="105" y="118" text-anchor="middle" fill="#F2F2EE" font-size="24" font-weight="900">Checklist</text>
      <text x="105" y="150" text-anchor="middle" fill="#8B949E" font-size="16">Define done</text>
    </g>
    <g transform="translate(816)">
      <rect x="0" y="0" width="210" height="196" rx="14" fill="#111111" stroke="#00D4AA" stroke-opacity=".34"/>
      <circle cx="105" cy="58" r="30" fill="#00D4AA"/>
      <text x="105" y="67" text-anchor="middle" fill="#080808" font-size="28" font-weight="900">5</text>
      <text x="105" y="118" text-anchor="middle" fill="#F2F2EE" font-size="24" font-weight="900">Automation</text>
      <text x="105" y="150" text-anchor="middle" fill="#8B949E" font-size="16">Repeat the routine</text>
    </g>
    <g transform="translate(1020)">
      <rect x="0" y="0" width="210" height="196" rx="14" fill="#111111" stroke="#00D4AA" stroke-opacity=".34"/>
      <circle cx="105" cy="58" r="30" fill="#00D4AA"/>
      <text x="105" y="67" text-anchor="middle" fill="#080808" font-size="28" font-weight="900">6</text>
      <text x="105" y="118" text-anchor="middle" fill="#F2F2EE" font-size="24" font-weight="900">Review</text>
      <text x="105" y="150" text-anchor="middle" fill="#8B949E" font-size="16">Owner checks it</text>
    </g>
  </g>
</svg>
